name: Feature request
description: Suggest a new action, setting or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or problem, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How it could work in trrek (which edge, corner or setting).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried

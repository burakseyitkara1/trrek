name: ci

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Intel image: GitHub-hosted macOS arm64 runners are capacity-constrained; the app is cross-compiled for arm64 below.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-
      - name: Build
        run: swift build -c release --arch arm64
      - name: Test
        run: swift test
      - name: Format check
        run: swiftformat --lint .
      - name: Lint
        run: swiftlint lint --strict
      - name: Package app
        run: scripts/build-app.sh --version 0.0.0 --build ${{ github.run_number }}
      - name: Archive app
        run: ditto -c -k --keepParent dist/trrek.app trrek-ci.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trrek-app
          path: trrek-ci.zip
          retention-days: 7

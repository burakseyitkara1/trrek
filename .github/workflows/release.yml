name: release-check

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    # Intel image: GitHub-hosted macOS arm64 runners are capacity-constrained; the app is cross-compiled for arm64 below.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build -c release --arch arm64
      - name: Test
        run: swift test
      - name: Package app
        run: |
          TAG="${GITHUB_REF_NAME}"
          scripts/build-app.sh --version "${TAG#v}" --build ${{ github.run_number }}
      # Releases are signed with Developer ID, notarized and published from the release Mac by
      # scripts/release.sh; this job only checks that the tagged commit builds and passes the tests.

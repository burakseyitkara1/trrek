name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --arch arm64
      - name: Test
        run: swift test
      - name: Package app
        run: |
          TAG="${GITHUB_REF_NAME}"
          scripts/build-app.sh --version "${TAG#v}" --build ${{ github.run_number }}
      - name: Create archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          ditto -c -k --keepParent dist/trrek.app "trrek-${TAG}.zip"
          hdiutil create -volname trrek -srcfolder dist/trrek.app -ov -format UDZO "trrek-${TAG}.dmg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --generate-notes "trrek-${TAG}.zip" "trrek-${TAG}.dmg"

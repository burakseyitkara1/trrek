<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>trrek trackpad zones: four edge strips and four corners</title>
<defs><clipPath id="pad"><rect x="260.0" y="96" width="440" height="300" rx="30"/></clipPath><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect x="260.0" y="96" width="440" height="300" rx="30" fill="#ececf0"/>
<g clip-path="url(#pad)"><rect x="260.0" y="96" width="40" height="300" fill="#1A85FF"/><rect x="660.0" y="96" width="40" height="300" fill="#1A85FF"/><rect x="260.0" y="96" width="440" height="40" fill="#1A85FF"/><rect x="260.0" y="356" width="440" height="40" fill="#1A85FF"/><rect x="260.0" y="96" width="40" height="40" fill="#FF9F0A"/><rect x="660.0" y="96" width="40" height="40" fill="#FF9F0A"/><rect x="260.0" y="356" width="40" height="40" fill="#FF9F0A"/><rect x="660.0" y="356" width="40" height="40" fill="#FF9F0A"/></g>
<rect x="260.0" y="96" width="440" height="300" rx="30" fill="none" stroke="#c7c7cc" stroke-width="2"/>
<line x1="280.0" y1="176" x2="280.0" y2="316" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><line x1="680.0" y1="176" x2="680.0" y2="316" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><line x1="360.0" y1="116.0" x2="600.0" y2="116.0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><line x1="360.0" y1="376.0" x2="600.0" y2="376.0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="480.0" y="240.0" text-anchor="middle" font-size="17" fill="#6e6e73">The middle of the trackpad</text>
<text x="480.0" y="264.0" text-anchor="middle" font-size="17" fill="#6e6e73">works as usual</text>
<text x="234.0" y="238.0" text-anchor="end" font-size="21" font-weight="600" fill="#1d1d1f">Brightness</text><text x="234.0" y="262.0" text-anchor="end" font-size="15" fill="#6e6e73">slide up or down</text>
<text x="726.0" y="238.0" text-anchor="start" font-size="21" font-weight="600" fill="#1d1d1f">Volume</text><text x="726.0" y="262.0" text-anchor="start" font-size="15" fill="#6e6e73">slide up or down</text>
<text x="480.0" y="50" text-anchor="middle" font-size="21" font-weight="600" fill="#1d1d1f">Switch Apps</text><text x="480.0" y="74" text-anchor="middle" font-size="15" fill="#6e6e73">slide left or right</text>
<text x="480.0" y="438" text-anchor="middle" font-size="21" font-weight="600" fill="#1d1d1f">Keyboard Backlight</text><text x="480.0" y="462" text-anchor="middle" font-size="15" fill="#6e6e73">slide left or right</text>
<rect x="150.0" y="493" width="16" height="16" rx="3" fill="#1A85FF"/><text x="174.0" y="508" font-size="16" fill="#1d1d1f">Edges: slide along</text><rect x="340.0" y="493" width="16" height="16" rx="3" fill="#FF9F0A"/><text x="364.0" y="508" font-size="16" fill="#1d1d1f">Corners: double tap (mute, screenshot, Mission Control…)</text>
<text x="480.0" y="542" text-anchor="middle" font-size="14" fill="#6e6e73">Defaults shown. Every edge and every corner runs the action you choose.</text>
</svg>
